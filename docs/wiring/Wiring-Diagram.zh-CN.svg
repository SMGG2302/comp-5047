<text x="1155" y="1147" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#172b3a">黑色：公共 GND</text>
<text x="55" y="1100" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#172b3a">接线须逐根对应“信号 / 电源 / 地”，不要按照片中杜邦线颜色推断功能。</text>
<text x="55" y="1140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#172b3a">扩展板 V 排针电压、黄色跳帽档位及各插座内侧 S/V/G 顺序未确认：先断电查通断，再测电压。</text>
<text x="55" y="1180" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#172b3a">图中 VCC/GND 文字也是必须连接的网络；同名网络相连。舵机 5V 不接 3V3。</text>
<text x="55" y="1218" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#172b3a">DS18B20、D35、TX0/RX0 不用于本配置；VP=GPIO36，VN=GPIO39。</text>
