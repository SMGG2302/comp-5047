<ns0:text x="1140" y="805" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#172b3a">Power connections</ns0:text>
<ns0:text x="1140" y="842" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#172b3a">ESP32: board USB from power bank</ns0:text>
<ns0:text x="1140" y="875" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#172b3a">Sensors: verified 3.3V-compatible modules</ns0:text>
<ns0:text x="1140" y="908" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#172b3a">Servo: +5V; negative to common GND</ns0:text>
<ns0:polyline points="985,810 1010,810 1010,1100 1140,1100" fill="none" stroke="#d52b36" stroke-width="5" stroke-linejoin="round" />
<ns0:text x="1155" y="1107" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#c62828">Red: 3V3, sensors only</ns0:text>
<ns0:polyline points="985,855 995,855 995,1140 1140,1140" fill="none" stroke="#25323b" stroke-width="5" stroke-linejoin="round" />
<ns0:text x="1155" y="1147" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#172b3a">Black: common GND</ns0:text>
<ns0:text x="55" y="1100" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#172b3a">Match signal, supply and ground at both ends. Actual wire colours do not establish function.</ns0:text>
<ns0:text x="55" y="1140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#172b3a">V-rail voltage, yellow jumper and S/V/G order are unconfirmed: check continuity off, then voltage on.</ns0:text>
<ns0:text x="55" y="1180" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#172b3a">VCC/GND labels are required connections. Join same-name nets. Never connect servo 5V to 3V3.</ns0:text>
<ns0:text x="55" y="1218" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#172b3a">DS18B20, D35 and TX0/RX0 are unused here. VP = GPIO36; VN = GPIO39.</ns0:text>
</ns0:svg>